# Read by SonarCloud Automatic Analysis (it ignores sonar-project.properties).
# Same exclusions as sonar-project.properties, plus docs/** (spec archives, investigation scripts, SQL drafts).
sonar.exclusions=docs/**,**/*spec.js,**/*test.js,**/*.spec.ts,**/*.test.ts,**/*.cy.ts,**/spec/**,**/specs/**,**/test/**,**/tests/**,**/__tests__/**,**/migrations/**,**/migrate/**,**/db/migrations/**,**/database/migrations/**
sonar.cpd.exclusions=docs/**,**/*.spec.ts,**/*.cy.ts
