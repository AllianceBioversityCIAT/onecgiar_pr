# Reusable: hands a finished CI run over to its Jenkins CD job.
#
# Same mechanism as the existing jenkins-trigger*.yml workflows (POST to the job with JENKINS_USERNAME and
# JENKINS_API_TOKEN), with three additions:
#   * `buildWithParameters`: Jenkins receives exactly what to deploy (immutable image digests), the commit and
#     the GitHub Actions run, instead of rebuilding a branch head.
#   * Error handling: the call fails unless Jenkins answers 201 with a queue item; the queue item is then
#     followed until it becomes a build (or is cancelled), so a request Jenkins never runs fails HERE and the
#     caller's CI-failure notification covers it.
#   * The credentials are passed to curl through stdin, never on the command line.
#
# Jenkins job contract (parameters):
#   GIT_COMMIT_SHA  40-hex commit the images were built from
#   GIT_REF         refs/heads/<branch>
#   GH_RUN_ID       <run id>-<attempt>
#   GH_RUN_URL      link to this GitHub Actions run attempt
#   ARTIFACTS       space-separated <unit>=sha256:<64-hex>, e.g. "backend=sha256:… frontend=sha256:…"
#   DRY_RUN         true: validate only, the target is not changed (the default of this workflow and of the job)
# The Jenkins job only coordinates the deploy on the target and reports the result to Slack. It never builds,
# tests or lints.
name: jenkins-cd (reusable)

on:
  workflow_call:
    inputs:
      jenkins-job:
        description: Jenkins CD job name, e.g. prms-reporting-tool-dev-cd
        type: string
        required: true
      environment:
        description: GitHub Environment of the CD hand-over (deployment branch rules apply)
        type: string
        required: true
      artifacts:
        description: Space-separated <unit>=sha256:<64-hex> list
        type: string
        required: true
      dry-run:
        description: Ask Jenkins to validate only (no change on the target)
        type: boolean
        default: true
      jenkins-url:
        type: string
        default: https://automation.prms.cgiar.org
      queue-wait-seconds:
        description: How long to follow the queue item until Jenkins starts the build
        type: number
        default: 300
    secrets:
      JENKINS_USERNAME:
        required: true
      JENKINS_API_TOKEN:
        required: true
    outputs:
      build-url:
        description: URL of the Jenkins build that runs the deploy
        value: ${{ jobs.trigger.outputs.build-url }}

permissions: {}

jobs:
  trigger:
    name: trigger ${{ inputs.jenkins-job }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    outputs:
      build-url: ${{ steps.trigger.outputs.build-url }}
    steps:
      - name: Trigger the Jenkins CD job and wait until it starts
        id: trigger
        env:
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_URL: ${{ inputs.jenkins-url }}
          JOB: ${{ inputs.jenkins-job }}
          ARTIFACTS: ${{ inputs.artifacts }}
          DRY_RUN: ${{ inputs.dry-run }}
          WAIT: ${{ inputs.queue-wait-seconds }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$JOB" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "::error::invalid Jenkins job name"; exit 1; }
          [[ "$JENKINS_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || { echo "::error::invalid Jenkins URL"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid commit"; exit 1; }
          [[ "$DRY_RUN" == "true" || "$DRY_RUN" == "false" ]] || { echo "::error::invalid dry-run"; exit 1; }
          read -r -a items <<<"$ARTIFACTS"
          [ "${#items[@]}" -gt 0 ] || { echo "::error::no artifacts to deploy (fail closed)"; exit 1; }
          for item in "${items[@]}"; do
            [[ "$item" =~ ^[a-z0-9][a-z0-9-]{0,31}=sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid artifact '$item'"; exit 1; }
          done
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"

          jenkins() { # jenkins <curl args...>: authenticated call, credentials through stdin
            printf 'user = "%s:%s"\n' "$JENKINS_USERNAME" "$JENKINS_API_TOKEN" | curl --config - -sS --max-time 30 "$@"
          }

          headers="$(mktemp)"
          code="$(jenkins -o /dev/null -D "$headers" -w '%{http_code}' -X POST \
            "${JENKINS_URL}/job/${JOB}/buildWithParameters" \
            --data-urlencode "GIT_COMMIT_SHA=${COMMIT}" \
            --data-urlencode "GIT_REF=${REF}" \
            --data-urlencode "GH_RUN_ID=${run_id}" \
            --data-urlencode "GH_RUN_URL=${run_url}" \
            --data-urlencode "ARTIFACTS=${ARTIFACTS}" \
            --data-urlencode "DRY_RUN=${DRY_RUN}")" || code="000"
          if [ "$code" != "201" ]; then
            echo "::error::Jenkins did not accept the build request (HTTP ${code}). A 400 usually means the job has no parameters yet."
            exit 1
          fi
          queue="$(tr -d '\r' <"$headers" | awk 'tolower($1)=="location:"{print $2}' | tail -n 1)"
          [[ "$queue" =~ ^https?://.+/queue/item/[0-9]+/?$ ]] || { echo "::error::Jenkins returned no queue item"; exit 1; }
          echo "Jenkins accepted the request: ${queue}"

          build_url=""
          deadline=$(( SECONDS + WAIT ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            item="$(jenkins "${queue%/}/api/json" 2>/dev/null || true)"
            if [ "$(jq -r '.cancelled // false' <<<"$item" 2>/dev/null)" = "true" ]; then
              echo "::error::Jenkins cancelled the queued build"; exit 1
            fi
            build_url="$(jq -r '.executable.url // empty' <<<"$item" 2>/dev/null || true)"
            [ -n "$build_url" ] && break
            sleep 5
          done
          if [ -z "$build_url" ]; then
            echo "::warning::the build did not start within ${WAIT}s; it is still queued: ${queue}"
            build_url="$queue"
          fi
          echo "build-url=${build_url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Jenkins CD"
            echo "- Job: \`${JOB}\` (DRY_RUN=${DRY_RUN})"
            echo "- Build: ${build_url}"
            echo "- Artifacts: \`${ARTIFACTS}\`"
            echo "Jenkins reports the result to Slack."
          } >> "$GITHUB_STEP_SUMMARY"
