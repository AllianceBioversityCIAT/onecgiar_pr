<div class="local_container" *ngIf="this.api.dataControlSE.currentResult?.result_type_id == 7 || this.api.dataControlSE.currentResult?.result_type_id == 2">
  <div class="annual_updating">
    <div class="title">
      <strong>Annual updating</strong>
      <div class="header">
        <!-- P2-3292: the 2026 wording is a question, so it must not be followed by a colon
             (repo convention: every question-shaped label passes [useColon]="false").
             The 2025-and-earlier label keeps its colon verbatim, as epic P2-3243 demands. -->
        <app-pr-field-header [label]="headerLabel" [useColon]="!usesStatusTriggerWording"> </app-pr-field-header>
      </div>
    </div>

    <app-pr-radio-button
      [(ngModel)]="this.generalInfoBody.is_discontinued"
      [verticalAlignment]="true"
      [options]="this.options"
      optionLabel="name"
      optionValue="value"
      [isStatic]="annualUpdatingEditable">
    </app-pr-radio-button>

    @if (this.generalInfoBody.is_discontinued == false) {
      <div class="message">
        <i class="pi pi-info-circle" style="font-size: 14px; margin-top: 2px; color: var(--pr-color-blue-600)"></i>
        <div class="message--text" [innerHTML]="alertText"></div>
      </div>
    }

    <div class="discontinued_options" *ngIf="this.generalInfoBody.is_discontinued">
      <!-- P2-3292 Step 2: the prompt above the reason checklist. 2026 branch only — up to 2025 the
           lead-in is part of the second radio label ("...was discontinued, because:"), and Step 1
           replaced that label with a bare "No", leaving the checklist with no prompt at all.
           The label is a question, so [useColon]="false" (same trap as the header above). -->
      @if (usesStatusTriggerWording) {
        <div class="discontinued_options__header">
          <app-pr-field-header
            [label]="reasonsHeaderLabel"
            [useColon]="false"
            [description]="reasonsHeaderHint"
            [showDescriptionLabel]="false">
          </app-pr-field-header>
        </div>
      }

      @for (discontinuedOption of this.generalInfoBody.discontinued_options; track $index; let i = $index) {
        <div class="discontinued_option">
          <app-pr-checkbox [label]="discontinuedOption?.option" [(ngModel)]="discontinuedOption.value" [isStatic]="annualUpdatingEditable">
          </app-pr-checkbox>
          <!-- P2-3292 Step 2: which reason owns the free-text box is now the catalogue's call
               (`requires_description`), because the 2026 "Other" row gets whatever id the
               AUTO_INCREMENT hands it and would never have matched the literal 6. The legacy row
               keeps being recognised by its id: flagging it would have meant an UPDATE on a live
               catalogue row, and rewriting those is exactly what epic P2-3243 forbids. -->
          <app-pr-input
            *ngIf="needsDescription(discontinuedOption)"
            placeholder="Enter text"
            type="text"
            [required]="false"
            [(ngModel)]="discontinuedOption.description"
            [disabled]="!annualUpdatingEditable">
          </app-pr-input>
        </div>
      }
    </div>

    <div appFeedbackValidation labelText="Annual Update" [isComplete]="generalInfoBody.is_discontinued != null"></div>

    <div appFeedbackValidation labelText="Reason for inactivity/discontinuation" [isComplete]="isDiscontinuedOptionsTrue()"></div>
  </div>
</div>
