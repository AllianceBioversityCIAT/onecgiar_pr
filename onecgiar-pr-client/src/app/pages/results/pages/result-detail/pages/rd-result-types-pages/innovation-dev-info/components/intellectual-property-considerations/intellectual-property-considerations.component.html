<!--
  P2-3272 / P2-3513. The server resolves this question BY TEXT and leaves the slot `undefined` when
  it cannot match it (`resolveIprSlotsForPhase`), which is the state of any environment where
  1788441000000-AddConsolidatedIprQuestionP25 has not run yet. Without this guard an unmatched slot
  throws on `question['radioButtonValue']` and takes the whole Innovation Development form down —
  the incident the same guard prevents in `app-stage-assessment`.
-->
@if (question) {
  <app-pr-field-header label="Intellectual property rights" [useColon]="false"></app-pr-field-header>

  <div class="pl-[20px]">
    <app-pr-radio-button
      (selectOptionEvent)="handleSelectionChange()"
      [label]="question?.question_text"
      [description]="question?.question_description"
      [options]="question?.options"
      optionLabel="question_text"
      optionValue="result_question_id"
      [verticalAlignment]="true"
      [(ngModel)]="question['radioButtonValue']">
    </app-pr-radio-button>

    <!--
      The two info points of the story, shown only for Yes / Not sure.

      Info Point 1 carries the URL the story gives, which the story itself marks as "to be
      confirmed with Nicoleta Trifa". The definition TEXT it also asks for was never provided, so
      the link goes out with the label the story uses and nothing invented around it.
      Info Point 2 is worded for SUBMISSION time — the timing the PO confirmed — and not for the
      moment the answer is picked, which is what the first draft of the story said.
    -->
    @if (isTriggerSelected) {
      <div class="message">
        <i class="pi pi-info-circle" style="font-size: 14px; margin-top: 2px; color: var(--pr-color-blue-600)"></i>
        <div class="message--text">
          <a [href]="ipDefinitionUrl" target="_blank" rel="noopener noreferrer">{{ ipDefinitionLabel }}</a>
        </div>
      </div>

      <div class="message">
        <i class="pi pi-info-circle" style="font-size: 14px; margin-top: 2px; color: var(--pr-color-blue-600)"></i>
        <div class="message--text">{{ notificationDisclosure }}</div>
      </div>
    }

    <div appFeedbackValidation [labelText]="question?.question_text" [isComplete]="isComplete"></div>
  </div>
}
