<div class="local_container" style="padding: 20px 50px 50px 50px">
  <h1 class="notifications_title">
    Notifications
    <!-- Reviewer finding (NOTIF-T-18): reuse the shared ⓘ trigger pattern (P2-3262/P2-3339) instead
         of a bespoke <i class="material-icons-round"> — same mechanism as result-detail.component.html's
         section-guidance ⓘ (button.sgi-dac-info > app-pr-info-icon, prTooltipStyleClass="sgi-dac-tooltip").
         Gated on non-empty content so it doesn't render as a dead, do-nothing trigger on Settings. -->
    @if (notificationsInfoTooltip) {
      <button
        type="button"
        class="sgi-dac-info"
        [prTooltip]="notificationsInfoTooltip"
        prTooltipPosition="right"
        prTooltipStyleClass="sgi-dac-tooltip"
        aria-label="About this page">
        <app-pr-info-icon />
      </button>
    }
  </h1>

  <div class="options">
    <div class="tabs">
      <a class="tab" routerLinkActive="active" routerLink="requests" (click)="this.clearFilters()">
        <i class="material-icons-round" style="font-size: 20px"> mark_unread_chat_alt </i>
        Requests
      </a>

      <a class="tab" routerLinkActive="active" routerLink="updates" (click)="this.clearFilters()">
        <i class="material-icons-round" style="font-size: 20px"> pending_actions </i>
        Updates
      </a>
    </div>

    <!-- Removed 2026-09-25 per user request: this icon-only Settings tab became redundant once
         `NOTIF-T-11` added a labeled "Notification settings" button in the Requests tab's own
         combined filter row (`requests.component.html`), which reuses this exact same
         routerLink="settings" + queryParams destination. -->
  </div>

  <div class="line"></div>

  <!-- NOTIF-T-11: the Requests-only Filter popover + Center/Bilateral-project facets + chips +
       "Clear all" (formerly the `@if` branch here) relocated to `RequestsComponent`, alongside the
       Received/Sent segmented tabs, per the mockup's single-row layout. This container now renders
       ONLY for Updates — the `@if (router.url.includes('/results-notifications/requests'))` /
       `@else` split no longer makes sense with the Requests branch gone, so it was removed in favor
       of gating the whole container on the Updates URL directly. Settings still renders nothing
       here (it never matched `/updates` either). -->
  <div class="notifications_filters" *ngIf="router.url.includes('/results-notifications/updates')">
    <div class="notifications_filters_field">
      <app-pr-select
        label="Phases"
        [required]="false"
        [options]="this.resultsNotificationsSE.phaseList"
        optionLabel="phase_name_status"
        optionValue="id"
        placeholder="Select phase"
        [overlayToBody]="true"
        [(ngModel)]="this.resultsNotificationsSE.phaseFilter"
        (ngModelChange)="this.resultsNotificationsSE.onPhaseChange($event)">
      </app-pr-select>
    </div>

    <div
      class="notifications_filters_field"
      [prTooltip]="!this.resultsNotificationsSE.phaseFilter ? 'Please select a phase first to enable this filter' : ''"
      prTooltipPosition="right">
      <app-pr-select
        [label]="this.resultsNotificationsSE.entityLabel"
        [required]="false"
        [options]="this.resultsNotificationsSE.filteredInitiatives"
        optionLabel="full_name"
        optionValue="initiative_id"
        [placeholder]="!this.resultsNotificationsSE.phaseFilter ? 'Select a phase first' : 'Select ' + this.resultsNotificationsSE.entityLabel"
        [(ngModel)]="this.resultsNotificationsSE.initiativeIdFilter"
        [disabled]="!this.resultsNotificationsSE.phaseFilter">
      </app-pr-select>
    </div>

    <div class="notifications_filters_field">
      <app-pr-field-header label="Search"></app-pr-field-header>
      <input type="text" hlmInput placeholder="Search" [(ngModel)]="this.resultsNotificationsSE.searchFilter" style="width: 100%" />
    </div>

    <div class="clear_filters_container">
      <app-pr-button
        [text]="'Clear filters'"
        [verticalMargin]="0.5"
        icon="filter_list_off"
        [colorType]="'primary'"
        [reverse]="true"
        (click)="clearAllFilters()"></app-pr-button>
    </div>
  </div>

  <router-outlet></router-outlet>
</div>
