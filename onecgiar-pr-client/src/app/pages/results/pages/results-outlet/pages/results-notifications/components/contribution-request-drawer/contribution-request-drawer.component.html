<hlm-sheet
  side="right"
  [state]="open() ? 'open' : 'closed'"
  [aria-labelledby]="labelledBy()"
  [aria-describedby]="describedBy()"
  (closed)="closed.emit()"
>
  <hlm-sheet-content
    *hlmSheetPortal="let ctx"
    [showCloseButton]="false"
    class="!w-[720px] sm:!max-w-[720px] max-[639px]:!w-screen flex flex-col gap-0 p-0 bg-surface-card motion-reduce:transition-none motion-reduce:animate-none"
    data-testid="crd-panel"
  >
    <ng-content />
  </hlm-sheet-content>
</hlm-sheet>
