<div class="local_container">
  <div routerLink="/result/results-outlet/results-list" style="max-width: fit-content">
    <app-pr-button
      text="Back to results"
      icon="arrow_back"
      [reverse]="true"
      [showBackground]="false"
      optionLabel="name"
      optionValue="code"></app-pr-button>
  </div>

  <!-- Don't delete - Global banner -->
  <!-- <div style="width: 100%;">
    <app-alert-global-info className="section_container local_container"
      inlineStyles="width: 100%"></app-alert-global-info>
  </div> -->

  <div class="local_container section_container">
    <div
      class="pr-body-2"
      [innerHTML]="
        naratives.greeting(
          this.api.authSE.localStorageUser?.user_name,
          this.api.dataControlSE.myInitiativesListText(this.api.dataControlSE.myInitiativesListReportingByPortfolio),
          this.api.rolesSE.isAdmin,
          this.terminologyService.t('term.entity.orPlatformsOrSGP', this.api.dataControlSE?.reportingCurrentPhase?.portfolioAcronym),
          this.terminologyService.t('term.entity.singular', this.api.dataControlSE?.reportingCurrentPhase?.portfolioAcronym)
        )
      "></div>
    <div class="report_container">
      <!-- Ai button -->
      <div class="text_mining_container">
        <img src="assets/work-in-progress.png" alt="under construction icon" class="under_construction_icon" />

        <app-pr-button
          text="Use AI assistant for reporting"
          icon="auto_awesome"
          [reverse]="true"
          [verticalMargin]="0"
          (click)="this.createResultManagementService.showModal.set(true)"></app-pr-button>
      </div>

      <!-- Initial load is a 4-deep serial chain (phases → roles → initiatives). Without this the
           select renders with an empty [options] list, which reads as "no entities available". -->
      @if (loadingInitialData()) {
        <div class="segment_title_margin flex flex-col gap-2 py-2" role="status" aria-live="polite" aria-busy="true">
          <span class="sr-only">Loading available entities...</span>
          <div class="pr-skeleton" style="width: 120px; height: 12px"></div>
          <div class="pr-skeleton" style="width: 100%; height: 38px"></div>
        </div>
      }

      <app-pr-select
        *ngIf="!loadingInitialData()"
        class="segment_title_margin"
        [group]="true"
        groupName="name"
        [options]="this.api.rolesSE.isAdmin ? this.allInitiatives : this.selectableInitiatives"
        label="Report for"
        [isStatic]="true"
        optionLabel="full_name"
        optionValue="initiative_id"
        [placeholder]="'Select ' + ('term.entity.singular' | term: this.api.dataControlSE?.reportingCurrentPhase?.portfolioAcronym)"
        [(ngModel)]="this.resultLevelSE.resultBody.initiative_id"
        (ngModelChange)="onSelectInit()">
      </app-pr-select>

      <app-result-level-buttons [currentResultType]="this.currentResultType"></app-result-level-buttons>

      <app-pr-radio-button
        label="Indicator category"
        *ngIf="this.resultLevelSE?.currentResultTypeList?.length"
        [options]="this.resultLevelSE.currentResultTypeList"
        [isStatic]="true"
        optionLabel="name"
        optionValue="id"
        [(ngModel)]="this.resultLevelSE.resultBody.result_type_id"
        (ngModelChange)="clean()">
      </app-pr-radio-button>

      <div *ngIf="this.resultLevelSE.resultBody.result_level_id">
        <app-alert-status *ngIf="isKnowledgeProduct" [description]="this.kpAlertDescription"> </app-alert-status>

        <div [ngClass]="{ mqap_sync_title: isKnowledgeProduct }">
          <app-pr-input
            *ngIf="isKnowledgeProduct"
            [isStatic]="true"
            placeholder="Handle..."
            label="Repository link/handle"
            type="text"
            [(ngModel)]="this.resultLevelSE.resultBody.handler">
          </app-pr-input>
          <div (click)="GET_mqapValidation()" class="sync_button" *ngIf="isKnowledgeProduct" [ngClass]="{ globalDisabled: validating }">
            <app-pr-button
              padding="medium"
              [text]="
                validating
                  ? this.resultLevelSE.resultBody.handler?.includes('20.500.11766')
                    ? 'Fetching metadata from MELSpace'
                    : this.resultLevelSE.resultBody.handler
                      ? 'Fetching metadata from CGSpace'
                      : 'Fetching metadata from the repository'
                  : 'Sync'
              "
              icon="sync"
              [rotating]="validating"></app-pr-button>
          </div>
        </div>

        <div *ngIf="isKnowledgeProduct && mqapUrlError.status" class="error__link" [innerHTML]="mqapUrlError.message"></div>

        <app-pr-input
          [disabled]="isKnowledgeProduct"
          [readOnly]="isKnowledgeProduct"
          [isStatic]="true"
          *ngIf="this.resultLevelSE.resultBody.result_type_id"
          [placeholder]="resultTypeNamePlaceholder + ''"
          label="Title"
          type="text"
          [maxWords]="30"
          [required]="resultLevelSE.resultBody.result_type_id != 6"
          [description]="
            isKnowledgeProduct
              ? this.resultLevelSE.resultBody.handler?.includes('20.500.11766')
                ? 'Title retrieved from MELSpace'
                : this.resultLevelSE.resultBody.handler
                  ? 'Title retrieved from CGSpace'
                  : 'Title retrieved from the repository'
              : 'To search for results that have already been reported, enter key words into the title box below. If your result has not already been reported, you can add it here.'
          "
          [(ngModel)]="this.resultLevelSE.resultBody.result_name"
          (ngModelChange)="depthSearch(this.resultLevelSE.resultBody.result_name)">
        </app-pr-input>

        <!-- Depth search + title-uniqueness check fire on every keystroke; tell the user they run. -->
        @if (!isKnowledgeProduct && loadingDepthSearch()) {
          <div class="flex items-center gap-2 py-2 text-[var(--pr-color-accents-5)]" role="status" aria-live="polite">
            <span class="material-icons-round animate-spin text-[16px]">progress_activity</span>
            <span class="pr-body-2">Searching for similar results...</span>
          </div>
        }

        <app-similar-results
          *ngIf="resultLevelSE.resultBody.result_type_id != 6 && this.resultLevelSE.resultBody.result_type_id"
          [options]="this.depthSearchList">
        </app-similar-results>
      </div>
    </div>

    <app-save-button [editable]="true" (clickSave)="onSaveSection()" text="Save and continue"> </app-save-button>
  </div>
</div>
<app-retrieve-modal></app-retrieve-modal>

@if (this.createResultManagementService.showModal()) {
  <app-result-ai-assistant [initiatives]="this.api.rolesSE.isAdmin ? this.allInitiatives : this.selectableInitiatives"></app-result-ai-assistant>
}
