<div class="entity-aow-card">
  <div class="entity-aow-card_header">
    <div class="entity-aow-card_header_content">
      <i class="pi pi-folder" style="font-size: 22px; color: var(--pr-color-neutral-200)"></i>

      <div>
        <p class="entity-aow-card_header_desc">{{ item?.code }}</p>
        <p class="entity-aow-card_header_title">{{ item?.name }}</p>
      </div>
    </div>

    <div
      #entityAowCardHeaderActions
      type="button"
      class="entity-aow-card_header_actions"
      routerLink="/result-framework-reporting/entity-details/{{ entityAowService.entityId() }}/aow/{{ item.code }}"
      (keydown.space)="$event.preventDefault(); entityAowCardHeaderActions.click()"
      (keydown.enter)="entityAowCardHeaderActions.click()">
      <p>Report against indicators</p>
      <i class="pi pi-arrow-right" style="font-size: 12px"></i>
    </div>
  </div>

  <div class="entity-aow-card_results">
    <div class="entity-results-by-indicator-category-card_results_item">
      <div class="dot" style="background-color: var(--pr-color-accents-3); margin-right: 3px"></div>
      Editing:<span class="font-weight-600">{{ item?.resultsCount?.editing }}</span>
    </div>

    <div class="entity-results-by-indicator-category-card_results_item">
      <div class="dot" style="background-color: var(--pr-color-blue-300); margin-right: 3px"></div>
      Submitted:<span class="font-weight-600">{{ item?.resultsCount?.submitted }}</span>
    </div>

    <!--
      P2-3296 AC3 — this Area of Work's ToC achievement. Sits beside the result counts, which
      answer a different question: those count what was reported, this says how far it got
      against the targets.
    -->
    @if (progress) {
      <div class="entity-aow-card_progress">
        <span class="entity-aow-card_progress_item">QA:<span class="font-weight-600">{{ progressLabel }}</span></span>
        <span class="entity-aow-card_progress_item">Prel.:<span class="font-weight-600">{{ preliminaryLabel }}</span></span>
        @if (coverage) {
          <span class="entity-aow-card_progress_coverage">{{ coverage }}</span>
        }
      </div>
    }
  </div>
</div>
