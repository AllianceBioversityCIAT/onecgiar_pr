<!-- @akili-spec changes/bilateral-review-center-strip-and-phase (BRC-T-2, R-1, R-2, R-20, R-21) -->
<!-- Chip classes copied verbatim from the status-chip block (`bilateral-review.component.html`)
     so this row reads as visually identical to its sibling — only the pressed/unpressed branch
     and the accessible name differ. -->
<div
  class="flex flex-wrap items-center gap-[8px] px-[16px] sm:px-[32px] py-[10px] bg-[var(--pr-surface-app)] border-b border-[var(--pr-border-divider)]"
  role="group"
  [attr.aria-label]="copy.groupAriaLabel"
  data-testid="bilateral-review-center-strip">
  <button
    type="button"
    [attr.aria-pressed]="allPressed()"
    [attr.aria-label]="copy.chipAriaLabel(copy.all, allPending())"
    data-testid="bilateral-review-center-chip-all"
    class="inline-flex h-[28px] cursor-pointer items-center gap-[6px] rounded-full border px-[12px] text-[12.5px] font-medium transition-colors"
    [class]="
      allPressed()
        ? 'border-[var(--pr-color-primary-300)] bg-[var(--pr-color-primary-50)] font-semibold text-[var(--pr-color-primary-700)]'
        : 'border-[var(--pr-border)] bg-[var(--pr-surface-card)] text-[var(--pr-text-secondary)] hover:border-[var(--pr-color-primary-300)]'
    "
    (click)="onAllClick()">
    {{ copy.all }}
    <span class="tabular-nums text-[11px] text-[var(--pr-text-subtle)]">{{ allPending() }}</span>
  </button>

  @for (item of visibleItems(); track item.code + '::' + item.acronym) {
    <button
      type="button"
      [attr.aria-pressed]="isPressed(item.code)"
      [attr.aria-label]="copy.chipAriaLabel(item.acronym, item.pending)"
      [attr.data-testid]="'bilateral-review-center-chip-' + testId(item.code)"
      class="inline-flex h-[28px] cursor-pointer items-center gap-[6px] rounded-full border px-[12px] text-[12.5px] font-medium transition-colors"
      [class]="
        isPressed(item.code)
          ? 'border-[var(--pr-color-primary-300)] bg-[var(--pr-color-primary-50)] font-semibold text-[var(--pr-color-primary-700)]'
          : 'border-[var(--pr-border)] bg-[var(--pr-surface-card)] text-[var(--pr-text-secondary)] hover:border-[var(--pr-color-primary-300)]'
      "
      (click)="onChipClick(item.code)">
      {{ item.acronym }}
      <span class="tabular-nums text-[11px] text-[var(--pr-text-subtle)]">{{ item.pending }}</span>
    </button>
  }

  @if (showMore()) {
    <button
      type="button"
      [attr.aria-expanded]="isExpanded()"
      data-testid="bilateral-review-center-chip-more"
      class="inline-flex h-[28px] cursor-pointer items-center gap-[6px] rounded-full border border-dashed border-[var(--pr-border)] bg-[var(--pr-surface-card)] px-[12px] text-[12.5px] font-medium text-[var(--pr-text-secondary)] transition-colors hover:border-[var(--pr-color-primary-300)]"
      (click)="expand()">
      {{ copy.moreLabel(hiddenCount()) }}
    </button>
  }
</div>
