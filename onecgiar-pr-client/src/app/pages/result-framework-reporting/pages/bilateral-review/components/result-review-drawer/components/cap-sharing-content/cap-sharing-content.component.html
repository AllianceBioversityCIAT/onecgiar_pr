@if (resultDetail && resultDetail.resultTypeResponse && resultDetail.resultTypeResponse.length > 0) {
  <h4 class="pr-h4 font-weight-600 text-black"># of people trained</h4>

  <div class="peopleFields" style="display: flex; gap: 16px; flex-wrap: wrap;">
    <app-pr-input
      placeholder="Type quantity"
      label="Women"
      type="number"
      [required]="false"
      [(ngModel)]="resultDetail.resultTypeResponse[0].female_using"
      [disabled]="disabled">
    </app-pr-input>

    <app-pr-input
      placeholder="Type quantity"
      label="Men"
      type="number"
      [required]="false"
      [(ngModel)]="resultDetail.resultTypeResponse[0].male_using"
      [disabled]="disabled">
    </app-pr-input>

    <app-pr-input
      placeholder="Type quantity"
      label="Non-binary"
      type="number"
      [required]="false"
      [(ngModel)]="resultDetail.resultTypeResponse[0].non_binary_using"
      [disabled]="disabled">
    </app-pr-input>

    <app-pr-input
      placeholder="Type quantity"
      label="Unknown"
      type="number"
      [required]="false"
      [(ngModel)]="resultDetail.resultTypeResponse[0].has_unkown_using"
      [disabled]="disabled">
    </app-pr-input>
  </div>

  <div style="margin-top: 16px;">
    <h4 class="pr-h4 font-weight-600 text-black">Total:</h4>
    <div class="readonly-chips-container">
      <span class="readonly-chip">{{ this.getTotalParticipants() }}</span>
    </div>
  </div>

  <!-- CSD-R-6 — the term cascade. `capdev_term_id` is still the single persisted key; these two
       controls decompose it for display and recompose it on a reviewer-initiated change (design.md §3). -->
  <app-pr-radio-button
    label="Length of training"
    [description]="lengthOfTrainingDescription()"
    [(ngModel)]="capdevTermId1"
    (ngModelChange)="onCapdevTermId1Change()"
    [options]="capdevsTerms()"
    optionLabel="name"
    optionValue="capdev_term_id"
    [required]="true"
    [disabled]="disabled">
  </app-pr-radio-button>

  <br />

  @if (capdevTermId1 === 4 || capdevTermId1 === 1 || capdevTermId1 === 2) {
    <app-pr-radio-button
      label="Degree"
      [(ngModel)]="capdevTermId2"
      (ngModelChange)="onCapdevTermId2Change()"
      [options]="capdevsSubTerms()"
      optionLabel="name"
      optionValue="capdev_term_id"
      [required]="false"
      [disabled]="disabled">
    </app-pr-radio-button>

    <br />
  }

  <app-pr-radio-button
    label="Delivery Method"
    [(ngModel)]="resultDetail.resultTypeResponse[0].capdev_delivery_method_id"
    [options]="deliveryMethodOptions()"
    optionLabel="name"
    optionValue="capdev_delivery_method_id"
    [required]="false"
    [disabled]="disabled">
  </app-pr-radio-button>
}
