<a
  class="framework-reporting-center-card-item"
  [routerLink]="['/bilateral', item?.center_acronym, 'home']">
  <div class="framework-reporting-center-card-item_header">
    <p class="framework-reporting-center-card-item_header_desc">CGIAR Center</p>
    <h3 class="framework-reporting-center-card-item_header_acronym">
      {{ item?.center_acronym || item?.center_id }}
    </h3>
    <p class="framework-reporting-center-card-item_header_name">
      {{ item?.center_name }}
    </p>
  </div>
</a>
