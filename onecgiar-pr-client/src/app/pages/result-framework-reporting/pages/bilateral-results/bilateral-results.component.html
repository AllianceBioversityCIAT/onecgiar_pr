<div class="bilateral-results-layout">
  <!-- Header - Breadcrumb -->
  <nav class="bilateral-results_breadcrumb" aria-label="Breadcrumb">
    <ol class="bilateral-results_breadcrumb_list">
      <li>
        <a class="bilateral-results_breadcrumb_homeLink" [routerLink]="programsListPath"> Science programs </a>
      </li>

      <li>
        <i class="pi pi-chevron-right bilateral-results_breadcrumb_separator" aria-hidden="true"></i>
        <a
          class="bilateral-results_breadcrumb_link"
          routerLink="/result-framework-reporting/entity-details/{{ bilateralResultsService.entityId() }}">
          {{ bilateralResultsService.entityId() }} - {{ bilateralResultsService.entityDetails().name }}
        </a>
      </li>

      <li>
        <i class="pi pi-chevron-right bilateral-results_breadcrumb_separator" aria-hidden="true"></i>
        @if (!hasCenter) {
          <span class="bilateral-results_breadcrumb_link breadcrumb_link" aria-current="page">Bilateral Results Review</span>
        } @else {
          <!-- Real link (focusable, middle-clickable); the handler still clears the
               selected-centre state the old (click)-only span used to reset. -->
          <a class="bilateral-results_breadcrumb_link" [routerLink]="resultsReviewPath()" (click)="clearSelectedCenter()">
            Bilateral Results Review
          </a>
        }
      </li>

      @if (hasCenter) {
        <li>
          <i class="pi pi-chevron-right bilateral-results_breadcrumb_separator" aria-hidden="true"></i>
          <span class="bilateral-results_breadcrumb_link breadcrumb_link" aria-current="page">{{ center }}</span>
        </li>
      }
    </ol>
  </nav>

  <div class="layout-content">
    <app-indicators-sidebar class="sidebar"></app-indicators-sidebar>

    <app-results-review-container class="main-container">
      <app-results-review-filters class="filters"></app-results-review-filters>
      <div class="results-content">
        <app-results-review-table></app-results-review-table>
      </div>
    </app-results-review-container>
  </div>
</div>
