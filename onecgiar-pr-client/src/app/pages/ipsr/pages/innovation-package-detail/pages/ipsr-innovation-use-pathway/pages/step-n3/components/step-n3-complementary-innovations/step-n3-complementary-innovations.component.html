<div class="complementary_innovations" *ngFor="let bodyItem of this.body.result_ip_result_complementary; let i = index">
  <app-collapsible-container [collapse]="bodyItem.open" (toggleCollapseEvent)="toggleCollapseItem($event, bodyItem)">
    <div header>
      <div class="header">
        <div>
          <strong>{{ i + 1 }}. </strong> {{ bodyItem.obj_result.title }}
        </div>
        <i class="material-icons-round green_check" [ngClass]="{ isValid: this.allFieldsRequired(bodyItem) }">check_circle</i>
      </div>
    </div>
    <div content>
      <div class="complementary_innovation">
        <app-pr-field-header
          [useColon]="false"
          [label]="'<strong>Complementary innovation/ enabler/ solution:</strong> ' + bodyItem?.obj_result?.title"
          [required]="false"></app-pr-field-header>

        <app-pr-field-header
          label="Innovation Readiness level evidence-based"
          [description]="this.readinessLevelSelfAssessmentText()"></app-pr-field-header>

        <app-pr-range-level
          itemTitle="name"
          itemDescription="definition"
          [options]="this.rangesOptions"
          optionLabel="name"
          optionValue="id"
          [(ngModel)]="bodyItem.readiness_level_evidence_based"></app-pr-range-level>
        <!-- P2-3824: evidence list per level (was one single link + details). `required` is computed
             per item: the old shared `rangeLevel1Required` field held whichever item was checked last. -->
        <app-ipsr-step3-evidence-list
          [owner]="bodyItem"
          level="readiness"
          [required]="isReadinessEvidenceRequired(bodyItem)"></app-ipsr-step3-evidence-list>

        <div class="fragment_section_divider"></div>

        <app-pr-field-header label="Innovation use level evidence-based" [description]="this.useLevelDelfAssessment()"></app-pr-field-header>

        <app-pr-range-level
          itemTitle="name"
          itemDescription="definition"
          [options]="this.innovationUseList"
          *ngIf="this.rangesOptions?.length"
          optionLabel="name"
          optionValue="id"
          [(ngModel)]="bodyItem.use_level_evidence_based"></app-pr-range-level>

        <app-ipsr-step3-evidence-list
          [owner]="bodyItem"
          level="use"
          [required]="isUseEvidenceRequired(bodyItem)"></app-ipsr-step3-evidence-list>
      </div>
    </div>
  </app-collapsible-container>
</div>
