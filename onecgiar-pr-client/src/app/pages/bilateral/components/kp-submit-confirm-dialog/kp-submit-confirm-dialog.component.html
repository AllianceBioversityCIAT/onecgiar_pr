<div hlmDialogHeader>
  <h2 hlmDialogTitle class="text-[18px]!">{{ copy.title }}</h2>
  <p hlmDialogDescription class="text-[15px]! leading-[1.5]!">{{ copy.body }}</p>
</div>

<div hlmDialogFooter>
  <button type="button" hlmBtn variant="brand" class="text-[14px]! h-10! px-4!" data-testid="kp-submit-confirm" (click)="confirm()">{{ copy.confirm }}</button>
  <button #cancelButton type="button" hlmBtn variant="outline" class="text-[14px]! h-10! px-4!" data-testid="kp-submit-cancel" (click)="cancel()">{{ copy.cancel }}</button>
</div>
