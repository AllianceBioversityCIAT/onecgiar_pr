<div class="tsf-fields">
  <!-- P2-3428 / AC17 — read-only once the result leaves Editing. `inert` rather than a flag per
       control: it takes the whole subtree out of reach for the pointer AND the keyboard, which a
       `disabled` on some inputs would not. `contents` keeps the wrapper out of the layout, so the
       spacing is unchanged. The full-metadata toggle stays OUTSIDE it — AC17 locks the fields and
       keeps the toggle working, because reading the optional metadata of a submitted result is
       part of reviewing it (P2-3520). -->
  <div class="contents" [inert]="readOnly()">
    <!--
    P2-3556 — the fetch failed, so every field below is blank for a reason that has nothing to do
    with what is stored. Autosave is off while `loaded()` is not true (see `queueTypeSave`) and this
    says so, through the same `app-alert-status` the section already uses for its MDS note — no new
    alert widget. Rendered only on `=== false`: `null` means the GET is still in flight, and a 404
    means "no policy-change row yet", which is the normal state of a new result — neither is an error.
    Placed at the TOP of the field list, above the fields it explains. The sibling Innovation
    Development section puts it under its note row only because that row is the first block of its own
    template; here the MDS note sits halfway down the form, and an error next to it would only be read
    after the person had already scrolled past every blank field.
  -->
    @if (loaded() === false) {
      <app-alert-status status="error" [description]="loadErrorNote"></app-alert-status>
    }

    <div class="tsf-policy-guidance">
      <span>Policy type guidance</span>
      <button
        type="button"
        class="tsf-policy-guidance__info"
        [prTooltip]="policyTypeDesc"
        prTooltipPosition="right"
        prTooltipStyleClass="tsf-policy-guidance-tooltip"
        aria-label="More information about policy types">
        <app-pr-info-icon />
      </button>
    </div>

    <app-pr-select
      [options]="policyControlList.policyTypesList"
      label="Policy type"
      optionLabel="name"
      optionValue="id"
      placeholder="Select policy type"
      [required]="true"
      [(ngModel)]="body.policy_type_id"
      (ngModelChange)="onPolicyTypeChange()">
    </app-pr-select>

    <app-pr-select
      [options]="policyControlList.policyStages"
      label="Stage"
      optionLabel="full_name"
      optionValue="id"
      placeholder="Select stage"
      [required]="true"
      [(ngModel)]="body.policy_stage_id"
      (ngModelChange)="onFieldChange()">
    </app-pr-select>

    <app-pr-multi-select
      [options]="institutionsService.institutionsList"
      label="Whose policy is this? (Implementing organizations)"
      [description]="institutionsDesc"
      selectedLabel="Organization"
      selectedOptionLabel="institutions_name"
      optionLabel="institutions_name"
      optionValue="institutions_id"
      placeholder="Select organization(s)"
      [required]="true"
      [(ngModel)]="body.institutions"
      (ngModelChange)="onFieldChange()">
    </app-pr-multi-select>

    <!--
      PCL-R-2/PCL-DD-2 (policy-change-usd-amount-layout) — USD amount + Status are the direct,
      always-visible consequence of the Policy type choice just above, so they render here rather
      than behind a second "Complete full metadata" click. AC6 (P2-3388, see the toggle block
      below) was about keeping the RELATED-TO QUESTION ungated by policy_type_id, not about hiding
      this pair once policy_type_id == 1 is already chosen in this always-visible area — see
      design.md §2.3 Reversion Challenge. Same grid utility Pool Funding uses for this pair
      (policy-change-info.component.html:6) so the two renderings match side by side.
    -->
    @if (body.policy_type_id == 1) {
      <div class="grid grid-cols-[repeat(auto-fit,minmax(190px,1fr))] gap-[20px]">
        <app-pr-input
          label="USD amount"
          type="currency"
          placeholder="0"
          [required]="false"
          [(ngModel)]="body.amount"
          (ngModelChange)="onFieldChange()">
        </app-pr-input>

        <app-pr-select
          [options]="statusOptions"
          label="Status"
          optionLabel="name"
          optionValue="id"
          placeholder="Select status"
          [required]="false"
          [expandSpaceOnOpen]="true"
          [(ngModel)]="body.status_amount"
          (ngModelChange)="onFieldChange()">
        </app-pr-select>
      </div>
    }
  </div>
  <div class="flex items-center justify-between gap-3 border-t border-[#ECEFF1] pt-3">
    <app-alert-status
      class="flex-1"
      status="info"
      [collapsible]="false"
      description="The fields displayed on this screen correspond to the minimum data standard (MDS) required for bilateral result reporting. If you need to complete the full metadata for this section, click the button on the right.">
    </app-alert-status>
    <button type="button" class="tsf-save-btn shrink-0" (click)="toggleShowAll()">
      {{ showAllFields() ? 'Hide full metadata' : 'Complete full metadata' }}
    </button>
  </div>

  <div class="contents" [inert]="readOnly()">
    @if (showAllFields()) {
      <div class="flex flex-col gap-[18px]" data-testid="type-policy-change-full-metadata-disclosure">
        <!--
        The policy change question is full metadata per the story. It used to sit nested alongside
        the USD amount/Status gate (AC6, P2-3388) because that pair lived in this same toggle; now
        that USD amount/Status render always-visible above (PCL-R-2), this is the sole remaining
        content of the disclosure. Do NOT nest this question under a `policy_type_id` gate the way
        USD amount/Status are gated — AC6 requires it to stay visible for every policy type, not
        just type 1, or it would wrongly disappear for types 2 and 3.
      -->
        @if (questions?.optionsWithAnswers?.length) {
          <app-pr-select
            [options]="questions.optionsWithAnswers"
            [label]="questions.question_text"
            optionLabel="question_text"
            optionValue="result_question_id"
            placeholder="Select an answer"
            [required]="false"
            [(ngModel)]="relatedTo"
            (ngModelChange)="onRelatedToChange(relatedTo)">
          </app-pr-select>
        }
      </div>
    }
  </div>
</div>

<!-- No in-section Save: every change is staged and the footer's Save draft persists the section
     (explicit-save model, 2026-09-03). The old button only re-staged what was already staged. -->
