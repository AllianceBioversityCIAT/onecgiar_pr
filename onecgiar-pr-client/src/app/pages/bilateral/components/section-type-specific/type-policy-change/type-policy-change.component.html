<div class="tsf-fields">
  <div class="tsf-policy-guidance">
    <span>Policy type guidance</span>
    <button
      type="button"
      class="tsf-policy-guidance__info"
      [prTooltip]="policyTypeDesc"
      prTooltipPosition="right"
      prTooltipStyleClass="tsf-policy-guidance-tooltip"
      aria-label="More information about policy types">
      <app-pr-info-icon />
    </button>
  </div>

  <app-pr-select
    [options]="policyControlList.policyTypesList"
    label="Policy type"
    optionLabel="name"
    optionValue="id"
    placeholder="Select policy type"
    [required]="true"
    [(ngModel)]="body.policy_type_id"
    (ngModelChange)="onFieldChange()">
  </app-pr-select>

  <app-pr-select
    [options]="policyControlList.policyStages"
    label="Stage"
    optionLabel="full_name"
    optionValue="id"
    placeholder="Select stage"
    [required]="true"
    [(ngModel)]="body.policy_stage_id"
    (ngModelChange)="onFieldChange()">
  </app-pr-select>

  <app-pr-multi-select
    [options]="institutionsService.institutionsList"
    label="Whose policy is this? (Implementing organizations)"
    [description]="institutionsDesc"
    selectedLabel="Organization"
    selectedOptionLabel="institutions_name"
    optionLabel="institutions_name"
    optionValue="institutions_id"
    placeholder="Select organization(s)"
    [required]="true"
    [(ngModel)]="body.institutions"
    (ngModelChange)="onFieldChange()">
  </app-pr-multi-select>

  <div class="flex items-center justify-between gap-3 border-t border-[#ECEFF1] pt-3">
    <app-alert-status
      class="flex-1"
      status="info"
      description="The fields displayed on this screen correspond to the minimum data standard (MDS) required for bilateral result reporting. If you need to complete the full metadata for this section, click the button on the right.">
    </app-alert-status>
    <button type="button" class="tsf-save-btn shrink-0" (click)="toggleShowAll()">
      {{ showAllFields() ? 'Hide full metadata' : 'Complete full metadata' }}
    </button>
  </div>

  @if (showAllFields()) {
    <div class="flex flex-col gap-[18px]">
      <!--
        The policy change question is full metadata per the story, and it sits INSIDE the toggle but
        OUTSIDE the policy-type gate below. That gate is correct — it is AC6, and W1/W2 does the same
        with *ngIf in policy-change-info.component.html:22 and :33 — but it only covers USD amount and
        Status. Nesting the question under it would hide it for policy types 2 and 3, and those are
        exactly the users who today press the button and see nothing happen.
      -->
      @if (questions?.optionsWithAnswers?.length) {
        <app-pr-select
          [options]="questions.optionsWithAnswers"
          [label]="questions.question_text"
          optionLabel="question_text"
          optionValue="result_question_id"
          placeholder="Select an answer"
          [required]="false"
          [(ngModel)]="relatedTo"
          (ngModelChange)="onRelatedToChange(relatedTo)">
        </app-pr-select>
      }

      @if (body.policy_type_id == 1) {
        <app-pr-input
          label="USD amount"
          type="currency"
          placeholder="0"
          [required]="false"
          [(ngModel)]="body.amount"
          (ngModelChange)="onFieldChange()">
        </app-pr-input>

        <app-pr-select
          [options]="statusOptions"
          label="Status"
          optionLabel="name"
          optionValue="id"
          placeholder="Select status"
          [required]="false"
          [expandSpaceOnOpen]="true"
          [(ngModel)]="body.status_amount"
          (ngModelChange)="onFieldChange()">
        </app-pr-select>
      }
    </div>
  }
</div>

<div class="tsf-actions">
  <button class="tsf-save-btn" type="button" [disabled]="saving()" (click)="onSave()">
    <i class="material-icons-round">{{ saving() ? 'hourglass_empty' : 'save' }}</i>
    {{ saving() ? 'Saving...' : 'Save' }}
  </button>
</div>
