<div class="tsf-fields">
  <div class="tsf-field">
    <label class="tsf-label">Short Title <span class="tsf-required">*</span></label>
    <input
      class="tsf-input"
      type="text"
      [(ngModel)]="body.short_title"
      (ngModelChange)="onFieldChange()"
      placeholder="Enter short title" />
  </div>

  <app-pr-select
    [options]="innovationControlListSE.typeList"
    label="Which of the below typologies best fits the nature of the innovation?"
    description="Choose 'other' if you feel the Innovation does not fit well with the proposed categories."
    optionLabel="extraInformation"
    optionValue="code"
    placeholder="Select innovation type"
    [extraInformation]="true"
    [required]="true"
    [(ngModel)]="body.innovation_nature_id"
    (ngModelChange)="onFieldChange()">
  </app-pr-select>

  <app-pr-textarea
    placeholder="Contact persons info goes here..."
    [required]="true"
    label="Innovation Developer"
    description="Provide the full name(s), email address and organizational affiliation(s) of the innovation developer/ contact person."
    [(ngModel)]="body.innovation_developers"
    (ngModelChange)="onFieldChange()">
  </app-pr-textarea>

  <app-pr-field-header
    label="How would you assess the current readiness of this innovation?"
    description="Use the slider to select the appropriate readiness level. Readiness levels range from 1 (basic research) to 9 (proven in operational environment).">
  </app-pr-field-header>

  <div class="tsf-readiness">
    <app-pr-range-level
      itemTitle="name"
      itemDescription="definition"
      optionLabel="name"
      optionValue="id"
      [options]="innovationControlListSE.readinessLevelsList"
      [(ngModel)]="body.innovation_readiness_level_id"
      (ngModelChange)="onFieldChange()">
    </app-pr-range-level>
  </div>
</div>

<div class="tsf-actions">
  <button class="tsf-save-btn" type="button" [disabled]="saving()" (click)="onSave()">
    <i class="material-icons-round">{{ saving() ? 'hourglass_empty' : 'save' }}</i>
    {{ saving() ? 'Saving...' : 'Save' }}
  </button>
</div>
