<div hlmDialogHeader>
  <h2 hlmDialogTitle class="text-[18px]!">Switch to the default ToC linkage</h2>
  <p hlmDialogDescription class="text-[15px]! leading-[1.5]!">{{ copy }}</p>
</div>

<div hlmDialogFooter>
  <button type="button" hlmBtn variant="brand" class="text-[14px]! h-10! px-4!" (click)="switch()">Switch to default</button>
  <button #cancelButton type="button" hlmBtn variant="outline" class="text-[14px]! h-10! px-4!" (click)="cancel()">Cancel</button>
</div>
