@if (ctx.centerAcronym()) {
  <div class="sticky top-0 z-[100] border-b border-[var(--pr-color-accents-2)] bg-white">
    <div class="mx-auto flex max-w-[1100px] items-center gap-2 px-7 py-2.5">
      @if (crumbs().length > 1) {
        <button
          type="button"
          class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md text-[var(--pr-color-accents-5)] transition-colors hover:bg-[var(--pr-color-accents-1)] hover:text-[var(--pr-color-secondary-400)]"
          (click)="goBack()"
          aria-label="Go back">
          <i class="material-icons-round text-[18px]">arrow_back</i>
        </button>
      }

      <nav hlmBreadcrumb aria-label="Bilateral navigation">
        <ol hlmBreadcrumbList class="text-[12px]">
          @for (crumb of crumbs(); track crumb.label; let last = $last) {
            <li hlmBreadcrumbItem>
              @if (crumb.link && !last) {
                <a hlmBreadcrumbLink [link]="crumb.link" class="text-[var(--pr-color-primary-300)] font-medium">
                  {{ crumb.label }}
                </a>
              } @else {
                <span hlmBreadcrumbPage class="text-[var(--pr-color-secondary-400)] font-semibold">
                  {{ crumb.label }}
                </span>
              }
            </li>
            @if (!last) {
              <li hlmBreadcrumbSeparator></li>
            }
          }
        </ol>
      </nav>
    </div>
  </div>
}

<router-outlet></router-outlet>
