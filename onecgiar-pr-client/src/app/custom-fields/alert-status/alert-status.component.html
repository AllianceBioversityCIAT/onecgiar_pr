<div class="pr_alert {{ status }}" [class.alert_boxed]="status === 'info' && !collapsible" [style]="inlineStyles">
  @if (isCollapsible) {
    <button
      type="button"
      class="alert_toggle"
      [attr.aria-expanded]="expanded()"
      [attr.aria-label]="collapsedLabel()"
      [attr.aria-controls]="panelId"
      (click)="toggle()">
      <span class="alert_badge"><i class="material-icons-round">{{ iconName }}</i></span>
    </button>
    <div class="alert_text pr-body-2 alert_popover" [id]="panelId" [hidden]="!expanded()" [innerHTML]="this.description"></div>
  } @else {
    <div class="alert_badge">
      <i class="material-icons-round">{{ iconName }}</i>
    </div>
    <div class="alert_text pr-body-2" [innerHTML]="this.description"></div>
  }
</div>
