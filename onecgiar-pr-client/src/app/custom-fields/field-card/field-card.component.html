<!-- Field block. Card chrome with a state-tinted header (proposal 18, approved 14-Sep-2026):
     the header says WHAT the field is and whether it is required, the tint says HOW it stands
     (green filled-required · blue filled-optional · amber required-and-empty · red over the limit),
     and the right-hand pill says the one thing nothing else tells you — whether the work is saved.

     🛑 No asterisk: requiredness is the `REQUIRED` tag and nothing else. An asterisk next to a tag
     that already says "REQUIRED" is the same claim twice, and the optional field needs no marker at
     all — the absence of the tag IS the marker.
     🛑 The right side never repeats "Complete / Required": the tint already carries that verdict.

     `.field_card` and `.fch_title` are load-bearing class names: `[appSectionSkeleton]` masks by the
     first and `mandatoryFieldLabel` reads the label out of the second. -->
<div
  [class.field_card]="!isBare"
  [class.fc-row]="!isBare && layout === 'row'"
  [class.fc-error]="!isBare && hasError"
  [class.fc-pinned]="pinned() && canPin"
  [attr.data-state]="isBare ? null : state"
  (input)="markEdited()"
  (change)="markEdited()">
  @if (showHeaderRow) {
    <div class="field_card_header" [style]="labelDescInlineStyles">
      <span class="fch_title" [innerHTML]="label + (useColon ? ':' : '')"></span>
      @if (required) {
        <span class="fch_required">Required</span>
        <span class="sr-only">(required)</span>
      }
      @if (tooltip) {
        <!-- P2-3201: pinnable. Field guidance moved out of the inline grey box carries links and
             several paragraphs, so it must survive the pointer leaving; Escape / outside click closes it. -->
        <!-- Fijar/soltar la guía vive DENTRO de la burbuja (Yeck, 14-sep-2026): el pin es una acción
             sobre lo que se está leyendo, y en la cabecera se leía como un tercer marcador del campo
             compitiendo con REQUIRED y con el estado de guardado. El botón lo pinta la directiva a
             partir de `prTooltipAction` (`shared/directives/pr-tooltip.directive.ts`), y al pulsarlo
             cierra la burbuja: el texto acaba de quedar anclado abajo y dejar las dos cosas abiertas
             duplicaría la guía en pantalla. -->
        <button
          type="button"
          class="sgi-dac-info"
          [prTooltip]="tooltip"
          prTooltipPosition="right"
          prTooltipStyleClass="sgi-dac-tooltip"
          [prTooltipAction]="
            canPin ? { label: pinned() ? 'Unpin guidance' : 'Pin guidance', pressed: pinned(), closeAfterClick: true } : null
          "
          (prTooltipActionClick)="togglePin()"
          aria-label="More information">
          <!-- P2-3339: inline SVG, not an icon-font ligature. The ligature name used to paint as
               literal text and overflow this 18px button onto the label. -->
          <app-pr-info-icon />
        </button>
      }
      @if (saveState !== 'none') {
        <span class="fch_save" [attr.data-save]="saveState" [attr.aria-live]="saveState === 'saved' ? 'polite' : null">
          @switch (saveState) {
            @case ('saved') {
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.2 8.4l3 3 6.6-6.8" />
              </svg>
              <span>Saved</span>
            }
            @case ('unsaved') {
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="8" r="3.4" fill="currentColor" /></svg>
              <span>Unsaved changes</span>
            }
            @case ('saving') {
              <svg class="fch_spin" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="8" cy="8" r="5.4" stroke-dasharray="24" stroke-dashoffset="8" />
              </svg>
              <span>Saving…</span>
            }
          }
        </span>
      }
    </div>
  }
  @if (showGuidanceBlock) {
    <div class="field_card_desc" [style]="descInlineStyles">
      <div class="desc_text" [innerHTML]="description || tooltip"></div>
      @if (pinned() && canPin) {
        <!-- Soltar desde la propia guía: una vez anclada, volver a abrir la burbuja solo para
             quitarla es un rodeo. El de la burbuja sigue existiendo — este es el atajo del que ya
             la tiene delante. -->
        <button type="button" class="fcd_unpin" (click)="togglePin()" aria-label="Unpin the guidance for this field" title="Unpin">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" />
          </svg>
        </button>
      }
    </div>
  }
  <ng-content></ng-content>
</div>
