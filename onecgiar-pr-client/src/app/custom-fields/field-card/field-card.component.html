<div [class.field_card]="!isBare" [ngClass]="isBare ? '' : 'fc-' + computedState">
  @if (showHeaderRow) {
    <div class="field_card_header">
      <span class="fch_title" [innerHTML]="label"></span>
      <span class="fch_tag">{{ required ? 'Mandatory' : 'Optional' }}</span>
      @if (tooltip) {
        <!-- P2-3201: pinnable. Field guidance moved out of the inline grey box carries links and
             several paragraphs, so it must survive the pointer leaving; Escape / outside click closes it. -->
        <button
          type="button"
          class="sgi-dac-info"
          [prTooltip]="tooltip"
          [prTooltipPinnable]="true"
          prTooltipPosition="right"
          prTooltipStyleClass="sgi-dac-tooltip"
          aria-label="More information">
          <!-- The glyph needs its own `material-icons-round` element: `.sgi-dac-info` styles the
               button but does not set the icon font, so the bare word rendered as literal text. -->
          <i class="material-icons-round" aria-hidden="true">info_outline</i>
        </button>
      }
      @if (!tooltip) {
        <span class="fch_info_wrap">
        <i class="material-icons-round fch_info" aria-label="Field color legend">info</i>
        <div class="fch_legend">
          <div class="legend_row"><span class="dot dot-blue"></span> Optional (empty)</div>
          <div class="legend_row"><span class="dot dot-orange"></span> Mandatory (empty)</div>
          <div class="legend_row"><span class="dot dot-green"></span> Filled / valid</div>
          <div class="legend_row"><span class="dot dot-red"></span> Over limit / invalid</div>
        </div>
        </span>
      }
    </div>
  }
  @if (showDescriptionBlock) {
    <div class="field_card_desc" [style]="descInlineStyles">
      <span class="desc_chip">Description</span>
      <div class="desc_text" [innerHTML]="description"></div>
    </div>
  }
  <ng-content></ng-content>
</div>
