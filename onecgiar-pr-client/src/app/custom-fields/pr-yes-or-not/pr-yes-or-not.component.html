<!-- Migrado de `app-pr-field-header` a `app-field-card` (14-sep-2026), como el resto de los campos
     reutilizables: cabecera tintada por estado + tag REQUIRED, y la guía dentro de la tarjeta.
     Antes este componente pintaba DOS headers — uno para el label (arriba, junto a los botones) y
     otro solo para la descripción (abajo) —, que es como `app-pr-field-header` obligaba a separar
     un label de su propia explicación. La tarjeta ya coloca las dos cosas, así que el segundo
     header desaparece sin que se pierda ningún texto.
     🛑 `hasValue` es `value != null` a propósito: este control es un booleano y `false` es una
     RESPUESTA ("No"), no un vacío. Con `!!value` un "No" respondido se pintaría como pendiente. -->
@if (this.dynamicData()) {
  <app-field-card
    [label]="this.label"
    [description]="this.description"
    [tooltip]="this.tooltip"
    [required]="this.required"
    [hasValue]="this.value !== null && this.value !== undefined"
    [showDescription]="!hideDescription"
    [descInlineStyles]="descInlineStyles"
    [labelDescInlineStyles]="this.labelDescInlineStyles"
    layout="inline">
    <div class="field_container">
      <div class="choices" *ngIf="!hideOptions">
        <div
          class="choice"
          [ngClass]="{ yes: this.value == true }"
          *ngIf="editable ? true : !(readOnly || this.rolesSE.readOnly) || this.value == true"
          (click)="editable ? onclickYes() : readOnly || this.rolesSE.readOnly ? null : onclickYes()">
          Yes
        </div>
        <div
          class="choice"
          [ngClass]="{ no: this.value == false }"
          *ngIf="editable ? true : !(readOnly || this.rolesSE.readOnly) || this.value == false"
          (click)="editable ? onClickNo() : readOnly || this.rolesSE.readOnly ? null : onClickNo()">
          No
        </div>
      </div>
    </div>
  </app-field-card>
}
