<!-- Migrado a `app-field-card` (14-sep-2026). `hasValue` = hay al menos una opción elegida, que es
     lo que este control considera "lleno"; no hay clase `complete` propia que copiar porque el
     multi-select no emite `.pr-field` (por eso los consumidores que deben contar para el bottom bar
     usan `appFeedbackValidation` — `src/CLAUDE.md` §21.5). -->
<app-field-card
  [label]="label()"
  [description]="description()"
  [required]="required()"
  [useColon]="true"
  [hasValue]="complete() ?? hasSelection"
  [labelDescInlineStyles]="labelDescInlineStyles()"
  [showDescription]="showDescriptionLabel()"
  [tooltip]="tooltip()"
  layout="boxed">
<div class="custom_select">
  <a class="field" tabindex="0" [id]="optionValue()" *ngIf="(!hideSelect() && !(readOnly() || this.rolesSE.readOnly)) || isStatic()">
    <div class="text select_placeholder">{{ placeholder() }}</div>
    <div class="icon_container"></div>
    <i class="pi pi-chevron-down icon_dropdown"></i>
    <div class="remove_focus" (click)="removeFocus()"></div>
    <div class="options" [class.result_picker_style]="resultPickerStyle()">
      <div class="search_input_container">
        <span class="material-icons-round search_icon">search</span>
        <input type="text" hlmInput placeholder="Search" [ngModel]="searchText" (ngModelChange)="onSearchInputChange($event)" style="width: 100%" />
      </div>

      <div class="util_container">
        <ng-content select="[util]"></ng-content>
      </div>

      <div class="bulk_selector" (click)="this.selectAllF()" *ngIf="showSelectAll()">
        {{ this.selectAll ? 'Unselect all' : 'Select all' }}
      </div>
      <ng-container *ngIf="group(); else flatList">
        <div class="custom_scroll" style="max-height: 300px; overflow: auto;">
          <div *ngFor="let grp of options()" class="group">
            <div class="pr-body-2" style="font-weight: 600; padding: 6px 10px;">{{ grp[optionGroupLabel()] }}</div>
            <div *ngFor="let option of filterChildrenBySearch(grp[optionGroupChildren()])" class="option" [ngClass]="{'disabled': option?.disabled}">
              <input type="checkbox" class="pr-native-check" [disabled]="option?.disabled" [(ngModel)]="option.selected" (ngModelChange)="onSelectOption(option)" />
              <img *ngIf="flagsCode()" [src]="'https://countryflagsapi.com/png/'+option[flagsCode()]" alt="" srcset="">
              <div class="label pr-body-2" [innerHtml]="getDisplayLabel(option)" (click)="option.selected = !option.selected; onSelectOption(option); $event.stopPropagation()"></div>
              <div class="event" (click)="$event.stopPropagation()"></div>
            </div>
          </div>
          <div *ngIf="!options()?.length || !getAllChildrenFromGroups(options())?.length" class="no_info">No information found</div>
        </div>
      </ng-container>
      <ng-template #flatList>
        <cdk-virtual-scroll-viewport [itemSize]="virtualOptionItemSize()" class="custom_scroll virtual_scroll">
          <div *ngIf="!filterFlatOptions(optionsIntance())?.length" class="no_info">
            No information found
          </div>
          <div
            *cdkVirtualFor="let option of filterFlatOptions(optionsIntance())"
            class="option"
            [ngClass]="{ disabled: option?.disabled }">
            <input type="checkbox" class="pr-native-check" [disabled]="option?.disabled" [(ngModel)]="option.selected" (ngModelChange)="onSelectOption(option)" />
            <img *ngIf="flagsCode()" [src]="'https://countryflagsapi.com/png/' + option[flagsCode()]" alt="" srcset="" />
            <div class="label pr-body-2" [innerHtml]="getDisplayLabel(option)" (click)="onSelectOption(option)"></div>
          </div>
        </cdk-virtual-scroll-viewport>
      </ng-template>
    </div>
  </a>
  <div class="selected_container custom_scroll" *ngIf="selectedLabel()">
    <app-pr-field-header [description]="selectedLabelDescription()"> </app-pr-field-header>

    <div class="chips_container" *ngIf="selectedOptionLabel()">
      <div
        class="pr_chip_selected"
        *ngFor="let option of value; let i = index"
        [ngClass]="{ is_active_false: logicalDeletion() && option.is_active == false }">
        <div class="name" [innerHtml]="getDisplayLabel(option, true) || option[selectedOptionLabel()]"></div>
        <i
          *ngIf="validateShowDeleteButton(option)"
          class="material-icons-round"
          (click)="confirmDeletion() && option.new ? confirmDeletionEvent(option) : removeOption(option)"
          >remove_circle
        </i>
      </div>
    </div>
  </div>
  <!-- Lo elegido ENTRA en la caja (Yeck, 14-sep-2026). Varios consumidores pintan sus propios chips
       —con medallas de lead, tooltips de CGSpace o borrados a medida— y hasta ahora los declaraban
       como HERMANOS del `app-pr-multi-select`, o sea FUERA del marco `fc-boxed`: el contenedor
       agrupaba titulo + descripcion + desplegable y dejaba la seleccion huerfana debajo.
       Este hueco los mete dentro sin obligar a nadie a reescribir su markup.
       🛑 Es solo para los chips. El marcador `appFeedbackValidation` de la seccion sigue siendo
       HERMANO del dropdown: anidarlo aqui haria que `mandatoryFieldLabel` reportara la etiqueta
       del desplegable en vez de la suya. -->
  <ng-content select="[selectedItems]"></ng-content>

  <app-alert-status
    *ngIf="showPartnerAlert()"
    description="If you don't find the partner you are looking for, <a class='open_route pSelectP'>request</a> to have it added to the list. Please note that once your partner request is approved, it could take up to an hour to be available in the CLARISA institutions list.">
  </app-alert-status>
</div>
</app-field-card>
