<div>
  <app-pr-field-header
    label="Provide URL to those studies"
    [required]="false"
    [useColon]="false"></app-pr-field-header>

  <div class="linkItem" *ngFor="let study of this.body.scaling_studies_urls; let i = index; trackBy: trackByIndex">
    <div class="index">{{ i + 1 }}</div>

    <div class="link">
      <app-pr-input [disabled]="disabled" placeholder="Add link" type="link" [required]="true" [(ngModel)]="this.body.scaling_studies_urls[i]"></app-pr-input>
    </div>

    <button class="icon" *ngIf="!this.api.rolesSE.readOnly && !this.api.dataControlSE?.currentResult?.status && !disabled" (click)="deleteStudiesLink(i)" type="button" aria-label="Delete study link">
      <i class="material-icons-round">delete</i>
    </button>
  </div>

  <!-- P2-3426: never in `disabled` mode — a retired, read-only question must render no empty
       placeholder block at all. -->
  <app-no-data-text
    *ngIf="!this.body.scaling_studies_urls.length && !disabled && !this.api.rolesSE.readOnly && !this.api.dataControlSE?.currentResult?.status"
    title="No study link added"></app-no-data-text>

  <br />

  <!-- P2-3426: `[disabled]` is kept for the pre-existing greyed-out cases; `*ngIf` now also drops
       the control entirely in read-only mode, matching the delete button above, because the
       retired question must offer no way to add an entry. -->
  <app-add-button
    name="Add another study link"
    (clickEvent)="addStudiesLink()"
    [disabled]="disabled"
    *ngIf="!disabled && !this.api.rolesSE.readOnly && !this.api.dataControlSE?.currentResult?.status">
  </app-add-button>
</div>
