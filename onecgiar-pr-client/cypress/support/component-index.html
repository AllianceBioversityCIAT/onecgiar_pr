<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRMS Components — Cypress CT</title>
    <!-- AIS-T-2 harness correction (Leader finding, 2026-09-03): `src/index.html:9-10` loads
         `Material Icons Round`/`Outlined` from Google Fonts; without it, `material-icons-round`
         ligatures (e.g. `arrow_forward` on the AoW row's 32px icon button) render as literal text
         instead of a glyph, inflating that button's width in CT measurements. The CT Chromium
         process this session spawns has no network route to fonts.googleapis.com/fonts.gstatic.com
         (confirmed: `curl` from the Bash tool reaches both with 200; the browser subprocess cannot —
         a sandbox/network-namespace difference specific to this environment), so the CDN `<link>` is
         self-hosted instead: the real `Material Icons Round` woff2 (only family this component uses —
         no `material-icons-outlined` in `program-overview/`, confirmed by grep), fetched verbatim
         from the URL the Google CSS resolves to and vendored under `./assets/`. `@font-face` and the
         `.material-icons-round` rule below are copied verbatim from that CSS response so glyph
         metrics match production exactly. Source: https://fonts.gstatic.com/s/materialiconsround/v109/LDItaoyNOAY6Uewc665JcIzCKsKc_M9flwmP.woff2
         (173,620 bytes; SHA-256 c948f1263341699b3c1e9c55d8d0f3e446669d0f2b9d55494c6169222c0243a6). -->
    <style>
      @font-face {
        font-family: 'Material Icons Round';
        font-style: normal;
        font-weight: 400;
        src: url('./assets/material-icons-round.woff2') format('woff2');
        font-display: block;
      }

      .material-icons-round {
        font-family: 'Material Icons Round';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div data-cy-root></div>
  </body>
</html>
